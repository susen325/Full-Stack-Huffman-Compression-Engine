<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Decompress</title>
    <link rel="stylesheet" href="style.css">

    <meta charset="UTF-8">
    <title>COM&D | Huffman Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-header">
        <h1>COM&D Huffman Engine</h1>
    </header>
    <div class="app-containerd">
        <a href="index.html" class="back-btn">← Back</a>
        <h2>Decompression</h2>
        <form id="decompForm">
            <label for="fileInput" class="custom-file-label" id="fileLabel">Select .zip or .huff</label>
            <input type="file" id="fileInput" accept=".zip,.huff" required>
            <input type="password" id="password" placeholder="Password">
            <button type="submit" id="submitBtn" class="submit-btn primary">
                 <div id="spinner" class="spinner"></div>
                 <span id="btnText">Compress Now</span>
            </button>
        </form>
        <div id="status" class="status-box"></div>
    </div>
    <script src="script.js"></script>
     <footer class="bg-primary text-white text-center py-3">
        <p>&copy; 2026 COM&D. All rights reserved.</p>
         <div style="width: 80px; text-align: left;">
            <a href="about.html" style="display: inline-block; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 6px; padding: 1px 2px; text-decoration: none; color: #475569; font-weight: bold; transition: background 0.2s;" onmouseover="this.style.background='#e2e8f0'" onmouseout="this.style.background='#f8fafc'">
                ℹ️ About
            </a>
        </div>
    </footer>
</body>
</html>
