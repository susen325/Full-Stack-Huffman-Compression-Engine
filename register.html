<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COM&D | Huffman Engine</title>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <title>Register | Huffman Engine</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-header">
        <h1>COM&D Huffman Engine</h1>
    </header>
    <div class="app-containereg">
        <h2>Create Account</h2>
        <form id="regForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="text" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit" class="submit-btn primary">Sign Up</button>
        </form>
        <p style="text-align:center;font:1.9rem;  text-align: 4rem; "><a href="login.html">Already have  an account  ?   Login</a></p>
        <div id="status" class="status-box"></div>
    </div>
    <script>
        document.getElementById('regForm').onsubmit = async (e) => {
            e.preventDefault();
            const formData = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            if (res.ok) window.location.href = 'login.html';
            else document.getElementById('status').innerText = await res.text();
        };
    </script>
    <footer class="bg-primary text-white text-center py-3">
        <p>&copy; 2026  All rights reserved.</p>
    </footer>
</body>
</html>
