<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings | Huffman Engine</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container { 
            max-width: 600px; 
            width: 95%; 
            margin: 40px auto; 
            background: #fff; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); 
        }
        
        /* Navigation / Top Bar */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 1px solid #e2e8f0; }
        #userGreeting { font-weight: 600; color: #475569; }
        .logout-link { text-decoration: none; color: #dc2626; font-size: 0.85rem; font-weight: bold; padding: 6px 12px; border: 1px solid #dc2626; border-radius: 6px; transition: all 0.2s; }
        .logout-link:hover { background: #dc2626; color: white; }

        .section { margin-top: 30px; padding-top: 20px; border-top: 1px solid #e2e8f0; }
        
        /* Danger Zone Styling */
        .danger-zone { 
            border: 2px solid #fca5a5; 
            background: #fef2f2; 
            padding: 20px; 
            border-radius: 8px; 
            margin-top: 40px; 
        }
        .danger-zone h3 { color: #dc2626; margin-top: 0; }
        
        input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border: 1px solid #cbd5e1; 
            border-radius: 6px; 
            box-sizing: border-box; 
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="top-bar">
            <span id="userGreeting">Loading...</span>
            <a href="/logout" class="logout-link">Logout 🚪</a>
        </div>

        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        
        <h2>Account Settings</h2>

        <div class="section">
            <h3>Change Password</h3>
            <p style="font-size: 0.9rem; color: #64748b;">Protect your compression history with a strong password.</p>
            <input type="password" id="currentPassword" placeholder="Current Password">
            <input type="password" id="newPassword" placeholder="New Password">
            <input type="password" id="confirmPassword" placeholder="Confirm New Password">
            <button onclick="updatePassword()" class="submit-btn primary" style="width:100%; margin-top:10px;">Update Password</button>
        </div>

        <div id="status" class="status-box"></div>

        <div class="danger-zone">
            <h3>Danger Zone</h3>
            <p style="font-size: 0.9rem; color: #475569; margin-bottom: 15px;">
                Deleting your account is permanent. All of your saved .huff/.zip file passwords and activity logs will be instantly wiped from the database.
            </p>
            <button onclick="deleteAccount()" class="submit-btn danger" style="width:100%; background: #dc2626; color: white;">Permanently Delete Account</button>
        </div>
    </div>

    <script>
        // --- LOAD USER INFO ---
        async function loadUserInfo() {
            try {
                const res = await fetch('/user-info');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('userGreeting').innerText = "Hi, " + data.username;
                } else {
                    window.location.href = 'login.html';
                }
            } catch (err) { console.error("Session fetch failed"); }
        }

        // --- UPDATE PASSWORD LOGIC ---
        async function updatePassword() {
            const currentPassword = document.getElementById('currentPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const status = document.getElementById('status');

            if (!currentPassword || !newPassword || !confirmPassword) {
                status.innerText = "Please fill in all fields.";
                status.style.color = "red";
                return;
            }

            if (newPassword !== confirmPassword) {
                status.innerText = "New passwords do not match!";
                status.style.color = "red";
                return;
            }

            status.innerText = "Updating...";
            status.style.color = "blue";

            const res = await fetch('/update-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ currentPassword, newPassword })
            });

            if (res.ok) {
                status.innerText = await res.text();
                status.style.color = "green";
                // Clear inputs on success
                document.getElementById('currentPassword').value = '';
                document.getElementById('newPassword').value = '';
                document.getElementById('confirmPassword').value = '';
            } else {
                status.innerText = await res.text();
                status.style.color = "red";
            }
        }

        // --- DELETE ACCOUNT LOGIC ---
        async function deleteAccount() {
            // Add a strict browser confirmation dialog
            const confirmation = confirm("WARNING: Are you sure you want to delete your account? This action cannot be undone.");
            if (!confirmation) return; // User clicked Cancel

            try {
                const res = await fetch('/delete-account', { method: 'POST' });

                if (res.ok) {
                    alert("Your account and all associated data have been deleted.");
                    window.location.href = 'register.html'; // Redirect to registration
                } else {
                    alert("Failed to delete account. Please try again.");
                }
            } catch (err) {
                alert("Server connection error.");
            }
        }

        // Initialize
        window.onload = loadUserInfo;
    </script>
</body>
</html>
