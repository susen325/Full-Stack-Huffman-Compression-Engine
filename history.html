<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activity History | Huffman Engine</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .history-container { max-width: 900px; width: 95%; margin: 20px auto; }
        
        /* Navigation / Top Bar Styling */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e2e8f0;
        }
        #userGreeting { font-weight: 600; color: #475569; }
        .logout-link {
            text-decoration: none; color: #dc2626; font-size: 0.85rem;
            font-weight: bold; padding: 6px 12px; border: 1px solid #dc2626;
            border-radius: 6px; transition: all 0.2s;
        }
        .logout-link:hover { background: #dc2626; color: white; }

        /* Table Styling */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; border-radius: 8px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background-color: #f8fafc; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }

        .pass-cell {
            font-family: 'Courier New', Courier, monospace;
            background: #f1f5f9; padding: 4px 8px; border-radius: 4px;
            color: #2563eb; font-weight: bold; transition: filter 0.3s ease;
        }

        .pass-hidden { filter: blur(6px); user-select: none; pointer-events: none; }

        .btn-reveal {
            background: #2563eb; color: white; border: none; padding: 10px 20px;
            border-radius: 6px; cursor: pointer; font-size: 0.85rem; transition: background 0.2s;
        }
        .btn-reveal:hover { background: #1d4ed8; }

        /* Modal Styles */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); }
        .modal-content { background: #fff; margin: 10% auto; padding: 30px; border-radius: 12px; width: 320px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        #otpInput { width: 100%; padding: 12px; margin: 20px 0; text-align: center; font-size: 1.5rem; letter-spacing: 8px; border: 2px solid #e2e8f0; border-radius: 8px; outline: none; }
        
        .badge { padding: 4px 8px; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; background: #dcfce7; color: #166534; }
    </style>
</head>
<body>
    <div class="history-container">
        <div class="top-bar">
            <span id="userGreeting">Loading...</span>
            <a href="/logout" class="logout-link">Logout 🚪</a>
        </div>

        <a href="index.html" class="back-btn">← Back to Dashboard</a>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 20px;">
            <h2>Activity History</h2>
            <button id="mainRevealBtn" onclick="requestOtp()" class="btn-reveal">🔓 Reveal Passwords</button>
        </div>
        
        <p class="subtitle">Your recent compression and decompression tasks.</p>

        <table id="historyTable">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Filename</th>
                    <th>Action</th>
                    <th>File Password</th>
                </tr>
            </thead>
            <tbody id="historyBody"></tbody>
        </table>

        <div id="status" class="status-box"></div>
    </div>

    <div id="otpModal" class="modal">
        <div class="modal-content">
            <h3>Verify Identity</h3>
            <p style="color: #64748b; font-size: 0.9rem;">Enter the code sent to your email or terminal.</p>
            <input type="text" id="otpInput" placeholder="000000" maxlength="6">
            <button onclick="verifyAndReveal()" class="submit-btn primary" style="width:100%">Verify & Unblur</button>
            <button onclick="closeModal()" style="background:none; border:none; color:#64748b; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <script>
        // --- 1. USER GREETING ---
        async function loadUserInfo() {
            try {
                const res = await fetch('/user-info');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('userGreeting').innerText = "Hi, " + data.username;
                } else {
                    window.location.href = 'login.html';
                }
            } catch (err) { console.error("Session fetch failed"); }
        }

        // --- 2. LOAD HISTORY ---
        async function loadHistory() {
            const body = document.getElementById('historyBody');
            try {
                const res = await fetch('/my-history');
                if (res.status === 401) { window.location.href = 'login.html'; return; }
                const data = await res.json();
                
                if (data.length === 0) {
                    body.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 40px; color: #64748b;">No activity logs found.</td></tr>';
                    return;
                }

                body.innerHTML = data.map(row => `
                    <tr>
                        <td style="color: #64748b; font-size: 0.8rem;">${new Date(row.timestamp).toLocaleString()}</td>
                        <td style="font-weight: 500;">${row.filename}</td>
                        <td><span class="badge">${row.action}</span></td>
                        <td>
                            <span class="pass-cell">${row.file_password || 'None'}</span>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                document.getElementById('status').innerText = "Database connection error.";
            }
        }

        // --- 3. OTP FLOW ---
        async function requestOtp() {
    const res = await fetch('/send-otp', { method: 'POST' });
    if (res.ok) {
        document.getElementById('otpModal').style.display = 'block';
    } else {
        const trueError = await res.text();
        alert("Server Error: " + trueError); // Now it will tell us the real issue!
    }
}

       async function verifyAndReveal() {
    const otpInput = document.getElementById('otpInput');
    const enteredOtp = otpInput.value;
    
    console.log("🔍 1. Sending OTP to server:", enteredOtp);
    
    try {
        const res = await fetch('/verify-otp', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enteredOtp })
        });

        console.log("📡 2. Server responded with status:", res.status);

      if (res.ok) {
    const cells = document.querySelectorAll('.pass-cell');
    cells.forEach(cell => {
        cell.classList.remove('pass-hidden');
        cell.style.filter = "none";
        cell.style.pointerEvents = "auto";
    });

    // --- UPDATED BUTTON LOGIC ---
    const btn = document.getElementById('mainRevealBtn');
    btn.innerText = "🔒 Re-lock Passwords"; // Change text
    btn.style.background = "#dc2626";       // Change to red
    btn.disabled = false;                  // Keep it clickable
    btn.onclick = () => location.reload(); // Clicking it now refreshes/re-locks the page
    // ----------------------------

    closeModal();
} else {
            const errorText = await res.text();
            console.error("❌ 3. Server rejected OTP:", errorText);
            alert("Verification Failed: " + errorText);
        }
    } catch (err) {
        console.error("🔥 Fetch error:", err);
        alert("Error: Could not connect to the server.");
    }
}
        function closeModal() {
            document.getElementById('otpModal').style.display = 'none';
            document.getElementById('otpInput').value = '';
        }

        // Initialize on load
        window.onload = () => {
            loadUserInfo();
            loadHistory();
        };
    </script>
</body>
</html>
